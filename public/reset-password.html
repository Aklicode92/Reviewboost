<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewBoost — Nytt lösenord</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:#F7F5EF;color:#111410;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .logo{font-family:'Instrument Serif',serif;font-size:22px;display:flex;align-items:center;gap:8px;margin-bottom:40px;text-decoration:none;color:#111410}
  .logo-dot{width:9px;height:9px;border-radius:50%;background:#1D9E75}
  .card{background:#fff;border-radius:20px;border:1px solid rgba(0,0,0,.07);padding:36px;width:100%;max-width:400px}
  .card h1{font-family:'Instrument Serif',serif;font-size:28px;margin-bottom:6px}
  .card p{font-size:14px;color:#6b7068;margin-bottom:24px;font-weight:300}
  .field{margin-bottom:14px}
  .field label{font-size:13px;color:#6b7068;display:block;margin-bottom:5px}
  .field input{width:100%;padding:11px 14px;border:1px solid rgba(0,0,0,.15);border-radius:10px;font-size:15px;font-family:'DM Sans',sans-serif;background:#F7F5EF;color:#111410;transition:.15s}
  .field input:focus{outline:none;border-color:#1D9E75;background:#fff}
  .btn-green{width:100%;padding:12px;background:#1D9E75;color:#fff;border:none;border-radius:999px;font-size:15px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
  .btn-green:hover{background:#0F6E56}
  .btn-green:disabled{opacity:.6;cursor:not-allowed}
  .error{background:#FCEBEB;color:#A32D2D;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
  .success{background:#E1F5EE;color:#0F6E56;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<a class="logo" href="https://reviewboost.se"><div class="logo-dot"></div>ReviewBoost</a>
<div class="card">
  <h1>Nytt lösenord</h1>
  <p>Välj ett nytt lösenord för ditt konto.</p>
  <div class="error" id="error"></div>
  <div class="success" id="success"></div>
  <div class="field">
    <label>Nytt lösenord</label>
    <input type="password" id="password" placeholder="Minst 6 tecken" />
  </div>
  <div class="field">
    <label>Bekräfta lösenord</label>
    <input type="password" id="password2" placeholder="Upprepa lösenordet" />
  </div>
  <button class="btn-green" id="save-btn" onclick="savePassword()">Spara nytt lösenord</button>
</div>

<script>
    (function() {
      const SUPABASE_URL = 'https://twbuaccltoolsnsbsyfq.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3YnVhY2NsdG9vbHNuc2JzeWZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1ODU2NzAsImV4cCI6MjA5MjE2MTY3MH0.UY4dmvejj34YzGC7yy_O8jcg7ZEHp0y018_BqJh0XbE';
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
      // Extrahera tokens från URL-hashen
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
    
      if (accessToken && refreshToken) {
        // Sätt sessionen manuellt med tokens från e-postlänken
        sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken })
          .then(({ error }) => {
            if (error) showError('Länken är ogiltig eller har gått ut. Begär en ny återställningslänk.');
          });
      } else {
        showError('Ingen giltig återställningslänk hittades. Begär en ny länk.');
      }
    
      window.savePassword = async function() {
        const password = document.getElementById('password').value;
        const password2 = document.getElementById('password2').value;
        if (!password || password.length < 6) { showError('Lösenordet måste vara minst 6 tecken'); return; }
        if (password !== password2) { showError('Lösenorden matchar inte'); return; }
        const btn = document.getElementById('save-btn');
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div>';
        const { error } = await sb.auth.updateUser({ password });
        btn.disabled = false;
        btn.textContent = 'Spara nytt lösenord';
        if (error) showError(error.message);
        else {
          showSuccess('Lösenordet är uppdaterat! Omdirigerar...');
          setTimeout(() => window.location.href = '/dashboard.html', 2000);
        }
      };
    
      function showError(msg) {
        document.getElementById('error').textContent = msg;
        document.getElementById('error').style.display = 'block';
        document.getElementById('success').style.display = 'none';
      }
    
      function showSuccess(msg) {
        document.getElementById('success').textContent = msg;
        document.getElementById('success').style.display = 'block';
        document.getElementById('error').style.display = 'none';
      }
    })();
    </script>
